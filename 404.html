<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>404 — Page Not Found</title>
	<style>
		body{font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;background:#f8f9fb;color:#202124;margin:0;display:flex;align-items:center;justify-content:center;height:100vh}
		.card{text-align:center;padding:2rem;border-radius:12px;background:#fff;box-shadow:0 6px 24px rgba(16,24,40,.08);max-width:600px;margin:1rem}
		h1{font-size:4rem;margin:.2rem 0;color:#111}
		p{margin:.5rem 0 1.2rem;color:#54565a}
		a.btn{display:inline-block;padding:.6rem 1rem;border-radius:8px;background:#0b63ff;color:#fff;text-decoration:none;font-weight:600}
		a.btn:hover{background:#084bdb}
		small{display:block;margin-top:1rem;color:#8a8d91}
	</style>
</head>
<body>
	<main class="card" role="main">
		<h1>404</h1>
		<p>We couldn't find the page you were looking for.</p>
		<a class="btn" href="/">Return to Home</a>
		<small>If you typed the address manually, please check the URL.</small>
	</main>
</body>
</html>
